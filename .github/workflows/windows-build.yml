name: Build Windows exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller packaging/windows/catholibs.spec --distpath dist --workpath build --noconfirm

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: catholibs-windows-exe
          path: dist/catholibs.exe

      - name: Publish/update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          if gh release view windows-build >/dev/null 2>&1; then
            gh release upload windows-build dist/catholibs.exe --clobber
          else
            gh release create windows-build dist/catholibs.exe \
              --title "Catholibs (Windows)" \
              --notes "Windows build of Catholibs, packaged with PyInstaller. This is unsigned, so Windows SmartScreen will likely show an 'Unknown publisher' prompt on first run -- click 'More info' then 'Run anyway'. Opens in Windows Terminal if it's installed."
          fi
